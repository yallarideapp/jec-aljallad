<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<title>JEC Admin — لوحة التحكم</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JEC Admin">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400&family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0B0C; --char:#141415; --char-2:#1C1C1E; --char-3:#242427;
  --bone:#EEE9E1; --mute:#A39E96; --line:rgba(238,233,225,.12); --line-2:rgba(238,233,225,.22);
  --gold:#CDB27E; --gold-2:#E3CDA0; --red:#E07B6A; --green:#8FBF8A; --blue:#8FB0D6;
  --f-ar:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-en:"Jost","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Jost",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--bone);font:400 15px/1.6 var(--f-body);-webkit-tap-highlight-color:transparent}
html[lang=en] body{font-family:var(--f-en),var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--gold-2)}
.num,.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--f-en);font-variant-numeric:tabular-nums;white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(11,11,12,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font:300 20px/1 var(--f-en);letter-spacing:.18em;color:var(--gold-2)}
.brand span{font:300 13px/1.2 var(--f-ar);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line-2);font-size:12px;color:var(--mute);white-space:nowrap}
.pill.demo{border-color:rgba(205,178,126,.5);color:var(--gold-2)}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--bone)}
.icon-btn:hover{border-color:var(--line-2)}
.lang-btn{font:400 13px var(--f-en);width:auto;padding:0 12px}

/* tabs: bottom on phones, under the bar on wide screens */
.tabs{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;background:rgba(20,20,21,.96);border-top:1px solid var(--line);padding-bottom:var(--safe-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;background:none;border:0;color:var(--mute);font-size:12px;cursor:pointer;position:relative}
.tabs button[aria-current=page]{color:var(--gold-2)}
.tabs button svg.i{width:22px;height:22px}
.tabs .dot{position:absolute;top:5px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--ink);font:500 11px/18px var(--f-en)}
@media (min-width:900px){
  .tabs{position:sticky;top:59px;inset:auto;border-top:0;border-bottom:1px solid var(--line);padding:0 16px;justify-content:flex-start;gap:4px;background:rgba(11,11,12,.92)}
  .tabs button{flex:none;flex-direction:row;gap:8px;padding:12px 16px;font-size:14px;border-bottom:2px solid transparent}
  .tabs button[aria-current=page]{border-bottom-color:var(--gold)}
  .tabs button svg.i{width:18px;height:18px}
  .tabs .dot{position:static}
}

main{max-width:1180px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
@media (min-width:900px){main{padding:24px 24px 120px}}
h1,h2,h3{font-family:var(--f-ar);font-weight:300;margin:0}
html[lang=en] h1,html[lang=en] h2,html[lang=en] h3{font-family:var(--f-en)}
h1{font-size:22px}
h2{font-size:17px}
.muted{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.card{background:var(--char);border:1px solid var(--line);border-radius:14px;padding:16px}
.note{border:1px solid rgba(205,178,126,.35);background:rgba(205,178,126,.07);border-radius:12px;padding:12px 14px;font-size:14px}
.note.warn{border-color:rgba(224,123,106,.45);background:rgba(224,123,106,.08)}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--char-2);cursor:pointer;text-decoration:none;color:var(--bone);font-size:14px;white-space:nowrap}
.btn:hover{border-color:rgba(205,178,126,.6)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:500}
.btn.gold:hover{background:var(--gold-2)}
.btn.line{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(224,123,106,.4);background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.field{display:block}
.field>span{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.field small{display:block;color:var(--mute);font-size:12px;margin-top:5px}
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=url],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--ink);outline:none;font-size:16px}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.err{color:var(--red);font-size:13px;min-height:0;margin:6px 0 0}
.err:empty{display:none}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.switch{position:relative;display:inline-flex;align-items:center;gap:12px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--char-3);border:1px solid var(--line-2);position:relative;flex:none;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:inset-inline-start .2s}
.switch input:checked{background:rgba(205,178,126,.35);border-color:var(--gold)}
.switch input:checked::after{inset-inline-start:21px;background:var(--gold-2)}
.grid2{display:grid;gap:12px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}

/* sign-in */
.auth{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:20px 0}
.auth .card{width:min(420px,100%);padding:24px}
.auth .logo{display:block;width:72px;height:72px;border-radius:16px;margin:0 auto 14px}
.auth h1{text-align:center;margin-bottom:6px}
.auth p.lead{text-align:center;color:var(--mute);margin:0 0 18px;font-size:14px}

/* requests */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:13px;color:var(--bone)}
.chip b{font:500 12px var(--f-en);color:var(--mute)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.chip[aria-pressed=true] b{color:var(--ink)}
.split{display:grid;gap:16px;margin-top:14px}
@media (min-width:900px){.split{grid-template-columns:minmax(320px,400px) 1fr;align-items:start}}
.list{display:flex;flex-direction:column;gap:8px}
.req{display:block;width:100%;text-align:start;background:var(--char);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--bone)}
.req:hover{border-color:var(--line-2)}
.req[aria-current=true]{border-color:var(--gold)}
.req .l1{display:flex;align-items:center;gap:8px}
.req .l1 b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req .l2{display:flex;gap:8px;color:var(--mute);font-size:13px;margin-top:3px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.new{color:var(--gold-2)} .st.contacted{color:var(--blue)} .st.quoted{color:#C9A5E0} .st.won{color:var(--green)} .st.closed{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 16px;border:1px dashed var(--line-2);border-radius:14px}
.detail{background:var(--char);border:1px solid var(--line);border-radius:14px;padding:18px}
.detail .hd{display:flex;align-items:flex-start;gap:10px}
.detail .hd h2{font-size:20px}
.statuses{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:14px 0}
.statuses button{min-height:40px;border-radius:10px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:13px;color:var(--bone)}
.statuses button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:500}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:14px 0;font-size:14px}
dl.kv dt{color:var(--mute)}
dl.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.back{display:none}
@media (max-width:899px){
  .detail-wrap{position:fixed;inset:0;z-index:40;background:var(--ink);overflow:auto;padding:calc(12px + var(--safe-t)) 14px calc(24px + var(--safe-b))}
  .detail-wrap .detail{border:0;background:none;padding:6px 2px}
  .back{display:inline-flex}
  body.lock{overflow:hidden}
}

/* projects */
.plist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.proj{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:var(--char);border:1px solid var(--line);border-radius:12px;padding:8px}
.proj.off{opacity:.55}
.proj img,.thumb-empty{width:76px;height:56px;object-fit:cover;border-radius:8px;background:var(--char-3);display:block}
.proj .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .t span{font-size:12px;color:var(--mute)}
.proj .t{min-width:0}
.proj .ctl{display:flex;gap:4px}
.proj .ctl .icon-btn{width:34px;height:34px}
@media (max-width:520px){.proj{grid-template-columns:64px 1fr}.proj img,.proj .thumb-empty{width:64px;height:50px}.proj .ctl{grid-column:1/-1;justify-content:flex-end}}
.savebar{position:fixed;inset-inline:0;bottom:calc(58px + var(--safe-b));z-index:35;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.savebar>div{pointer-events:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--char-2);border:1px solid rgba(205,178,126,.55);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:640px;width:100%}
.savebar span{flex:1;min-width:160px;font-size:14px}
@media (min-width:900px){.savebar{bottom:20px}}

/* sheet (editor and confirm) */
.sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;background:rgba(0,0,0,.6)}
.sheet>.panel{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--char);border:1px solid var(--line-2);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
@media (min-width:700px){.sheet{place-items:center}.sheet>.panel{border-radius:18px;padding:22px}}
.photo-pick{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center}
.photo-pick img,.photo-pick .thumb-empty{width:140px;height:96px;border-radius:10px;object-fit:cover}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-size:14px;color:var(--bone)}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--ink)}

/* settings */
.sets{display:grid;gap:14px}
@media (min-width:900px){.sets{grid-template-columns:1fr 1fr;align-items:start}}
.sets .card h2{margin-bottom:4px}
.sets .card>p{margin:0 0 12px;color:var(--mute);font-size:14px}
.devs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.devs li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.devs li span{flex:1;min-width:0}
.ok{color:var(--green)} .bad{color:var(--red)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--safe-b));z-index:80;max-width:min(520px,92vw);padding:11px 16px;border-radius:12px;background:var(--char-2);border:1px solid var(--line-2);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.toast.bad{border-color:rgba(224,123,106,.6)}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--mute)}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--gold);animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>
</head>
<body>
<div class="boot" id="boot"><span class="spin" aria-label="…"></span></div>
<header class="top" id="top" hidden>
  <div class="brand"><b>JEC</b><span id="brandSub"></span></div>
  <span class="pill demo" id="demoPill" hidden></span>
  <span class="sp"></span>
  <button class="icon-btn lang-btn" id="langBtn" type="button"></button>
</header>
<nav class="tabs" id="tabs" hidden></nav>
<main id="app"></main>
<div class="savebar" id="savebar" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="sheetHost"></div>

<script src="../shared/data.js?v=1"></script>
<script src="../shared/client.js?v=1"></script>
<script>
"use strict";
/* JEC admin panel: requests sent from the site, the projects gallery and the alerts. Talks to the server through
   JECAPI (shared/client.js); without the server (GitHub Pages preview) it runs as a demo kept in this browser only. */
const API = JECAPI; API.setBase("../");
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }, del(k){ try { localStorage.removeItem(k); } catch (e) {} } };
let lang = store.get("jec-admin-lang") === "en" ? "en" : "ar";

/* ---------------- words ---------------- */
const T = {
  sub: ["لوحة التحكم", "Admin panel"],
  demo: ["نسخة عرض", "Demo"],
  demoNote: ["نسخة عرض: كل شي هنا محفوظ في هذا المتصفح فقط، والطلبات المرسلة من صفحة العرض لا تصل للشركة. النسخة الحقيقية تعمل بعد ربط الموقع بـ Cloudflare.", "Demo: everything here is kept in this browser only, and requests sent from the preview page do not reach the company. The real version works once the site is connected to Cloudflare."],
  tReq: ["الطلبات", "Requests"], tProj: ["المشاريع", "Projects"], tSet: ["الإعدادات", "Settings"],
  setupTitle: ["إعداد كلمة السر", "Set the password"],
  setupLead: ["أول مرة: اختر كلمة سر للوحة التحكم.", "First time: choose a password for the admin panel."],
  loginTitle: ["تسجيل الدخول", "Sign in"],
  loginLead: ["لوحة تحكم موقع شركة الجلاد للمقاولات", "AlJallad Contracting website admin"],
  resetTitle: ["تغيير كلمة سر منسية", "Reset a forgotten password"],
  resetLead: ["أدخل رمز الإعداد (ADMIN_SETUP_CODE) الموجود في إعدادات Cloudflare، ثم كلمة سر جديدة. كل الأجهزة المسجّلة ستخرج.", "Enter the setup code (ADMIN_SETUP_CODE) from the Cloudflare settings, then a new password. Every signed-in device is signed out."],
  code: ["رمز الإعداد", "Setup code"],
  codeHint: ["الرمز الذي أضفته في Cloudflare باسم ADMIN_SETUP_CODE.", "The value you added in Cloudflare as ADMIN_SETUP_CODE."],
  noCode: ["لم يُضف رمز الإعداد في Cloudflare بعد (ADMIN_SETUP_CODE). أضفه من إعدادات الـ Worker ثم حدّث هذه الصفحة — الخطوات في دليل الربط.", "The setup code is not in Cloudflare yet (ADMIN_SETUP_CODE). Add it in the Worker's settings, then reload this page — see the connection guide."],
  password: ["كلمة السر", "Password"], newPassword: ["كلمة السر الجديدة", "New password"], confirm: ["أعد كتابة كلمة السر", "Repeat the password"],
  current: ["كلمة السر الحالية", "Current password"],
  pwHint: ["10 أحرف على الأقل.", "At least 10 characters."],
  mismatch: ["كلمتا السر غير متطابقتين.", "The two passwords don't match."],
  save: ["حفظ", "Save"], signIn: ["دخول", "Sign in"], forgot: ["نسيت كلمة السر؟", "Forgot the password?"], backLogin: ["رجوع لتسجيل الدخول", "Back to sign in"],
  demoReset: ["في نسخة العرض لا يوجد رمز إعداد: امسح بيانات العرض من هذا المتصفح وابدأ من جديد.", "The demo has no setup code: clear the demo data in this browser and start again."],
  clearDemo: ["مسح بيانات العرض", "Clear demo data"],
  clearDemoQ: ["سيُمسح كل ما في نسخة العرض على هذا المتصفح: الطلبات والمعرض والإعدادات. متابعة؟", "Everything in the demo on this browser is deleted: requests, gallery and settings. Continue?"],
  demoNoPw: ["نسخة العرض تفتح بدون كلمة سر لأنها لا تحتوي بيانات حقيقية. النسخة الحقيقية على Cloudflare محمية بكلمة سر.", "The demo opens without a password because it holds no real data. The real version on Cloudflare is protected by a password."],
  all: ["الكل", "All"],
  s_new: ["جديد", "New"], s_contacted: ["تم التواصل", "Contacted"], s_quoted: ["أُرسل عرض سعر", "Quote sent"], s_won: ["تم الاتفاق", "Agreed"], s_closed: ["مغلق", "Closed"],
  search: ["بحث بالاسم أو الهاتف أو رقم الطلب", "Search name, phone or request number"],
  refresh: ["تحديث", "Refresh"], more: ["عرض المزيد", "Show more"],
  emptyAll: ["لا توجد طلبات بعد. الطلبات المرسلة من نموذج الموقع ستظهر هنا.", "No requests yet. Requests sent from the site's form appear here."],
  emptyF: ["لا توجد طلبات هنا.", "Nothing here."],
  pick: ["اختر طلبًا من القائمة لعرض تفاصيله.", "Pick a request to see its details."],
  back: ["رجوع", "Back"],
  call: ["اتصال", "Call"], wa: ["واتساب", "WhatsApp"], copy: ["نسخ الطلب", "Copy request"], del: ["حذف", "Delete"],
  copied: ["تم النسخ.", "Copied."], copyFail: ["تعذّر النسخ.", "Couldn't copy."],
  delQ: ["حذف هذا الطلب نهائيًا؟ لا يمكن التراجع.", "Delete this request for good? This can't be undone."],

async function call(method, path, body, opts = {}){
  const r = await API.call(method, path, body);
  if (r && r.ok) return r;
  if (r && r.error === "auth" && path.startsWith("admin/") && !opts.authOk){ S.authed = false; await showAuth(); toast(errText("auth"), true); return null; }

}
function sheet(html, onClose){
  const host = $("#sheetHost");
  host.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="panel">${html}</div></div>`;
  const el = host.firstElementChild;
  el.addEventListener("click", e => { if (e.target === el){ closeSheet(); onClose && onClose(); } });
  document.body.classList.add("lock");
  const f = el.querySelector("[autofocus]"); if (f) setTimeout(() => f.focus(), 50);
  return el;
}

function waNumber(p){
  let d = String(p || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (/^07\d{8}$/.test(d)) d = "962" + d.slice(1);

  return d;
}

const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

/* ---------------- frame ---------------- */
function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("#langBtn").textContent = lang === "ar" ? "EN" : "ع"; $("#langBtn").setAttribute("aria-label", lang === "ar" ? "English" : "العربية");
  $("#brandSub").textContent = t("sub"); $("#demoPill").textContent = t("demo"); $("#demoPill").hidden = !isDemo();
  document.title = "JEC Admin — " + t("sub");
}
function renderTabs(){
  const n = S.counts.new || 0;
  $("#tabs").innerHTML = [["requests", "inbox", "tReq"], ["projects", "grid", "tProj"], ["settings", "gear", "tSet"]].map(([v, i, k]) =>
    `<button type="button" data-tab="${v}" ${S.view === v ? 'aria-current="page"' : ""}>${ic(i)}<span>${esc(t(k))}</span>${v === "requests" && n ? `<span class="dot num">${n > 99 ? "99+" : n}</span>` : ""}</button>`).join("");
}
function frame(on){ $("#top").hidden = false; $("#tabs").hidden = !on; $("#boot").hidden = true; applyLang(); if (on) renderTabs(); }
function setBadge(){ try { const n = S.counts.new || 0; if (navigator.setAppBadge){ n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } } catch (e) {} }

/* ---------------- sign-in ---------------- */
async function showAuth(view){
  S.view = "auth"; $("#savebar").hidden = true; S.sel = null; document.body.classList.remove("lock");
  const st = S.stateInfo = (await call("GET", "admin/state", undefined, { quiet: true })) || {};
  if (!st.ok){ frame(false); $("#app").innerHTML = `<div class="auth"><div class="card stack"><p class="err">${esc(errText(st.error))}</p><button class="btn gold block" data-act="retry">${esc(t("refresh"))}</button></div></div>`; return; }
  if (st.auth){ S.authed = true; return start(); }
  S.authView = view || (st.hasPassword ? "login" : "setup");
  frame(false);
  const demoNote = isDemo() ? `<div class="note small">${esc(t("demoNote"))}</div>` : "";
  const user = `<input type="text" name="username" autocomplete="username" value="JEC admin" hidden>`;
  let body = "";
  if (S.authView === "login"){
    body = `<h1>${esc(t("loginTitle"))}</h1><p class="lead">${esc(t("loginLead"))}</p>
      <form id="fLogin" class="stack">${user}
        <label class="field"><span>${esc(t("password"))}</span><input type="password" id="pw" autocomplete="current-password" required autofocus></label>
        <p class="err" id="aErr"></p>
        <button class="btn gold block" type="submit">${esc(t("signIn"))}</button>
        <button class="btn line block" type="button" data-act="auth-reset">${esc(t("forgot"))}</button>
      </form>`;
  } else {
    const reset = S.authView === "reset";
    if (reset && isDemo()){
      body = `<h1>${esc(t("resetTitle"))}</h1><p class="lead">${esc(t("demoReset"))}</p><div class="stack"><button class="btn danger block" data-act="clear-demo">${esc(t("clearDemo"))}</button><button class="btn line block" data-act="auth-login">${esc(t("backLogin"))}</button></div>`;
    } else {
      const noCode = !isDemo() && !st.setupReady;
      body = `<h1>${esc(t(reset ? "resetTitle" : "setupTitle"))}</h1><p class="lead">${esc(t(reset ? "resetLead" : "setupLead"))}</p>
        ${noCode ? `<div class="note warn small" style="margin-bottom:12px">${esc(t("noCode"))}</div>` : ""}
        <form id="fSetup" class="stack">${user}
          ${isDemo() ? "" : `<label class="field"><span>${esc(t("code"))}</span><input type="password" id="code" autocomplete="off" required ${noCode ? "disabled" : "autofocus"}><small>${esc(t("codeHint"))}</small></label>`}
          <label class="field"><span>${esc(t(reset ? "newPassword" : "password"))}</span><input type="password" id="pw" autocomplete="new-password" minlength="10" required ${noCode ? "disabled" : ""} ${isDemo() ? "autofocus" : ""}><small>${esc(t("pwHint"))}</small></label>
          <label class="field"><span>${esc(t("confirm"))}</span><input type="password" id="pw2" autocomplete="new-password" minlength="10" required ${noCode ? "disabled" : ""}></label>
          <p class="err" id="aErr"></p>
          <button class="btn gold block" type="submit" ${noCode ? "disabled" : ""}>${esc(t("save"))}</button>
          ${reset ? `<button class="btn line block" type="button" data-act="auth-login">${esc(t("backLogin"))}</button>` : ""}
        </form>`;
    }
  }
  $("#app").innerHTML = `<div class="auth"><div class="card"><img class="logo" src="icon-192.png" alt="">${body}${demoNote ? `<div style="margin-top:16px">${demoNote}</div>` : ""}</div></div>`;
  const f = $("[autofocus]", $("#app")); if (f) f.focus();
}
async function submitAuth(form){
  const err = $("#aErr"), btn = form.querySelector("[type=submit]"); err.textContent = "";
  const pw = $("#pw").value;
  if (form.id === "fLogin"){
    btn.disabled = true; const r = await call("POST", "admin/login", { password: pw }, { quiet: true }); btn.disabled = false;
    if (!r.ok){ err.textContent = errText(r.error); return; }
  } else {
    if (pw.length < 10){ err.textContent = errText("password-short"); return; }
    if (pw !== $("#pw2").value){ err.textContent = t("mismatch"); return; }
    btn.disabled = true;
    const r = await call("POST", S.authView === "reset" ? "admin/reset" : "admin/setup", { code: $("#code") ? $("#code").value : "", password: pw }, { quiet: true });
    btn.disabled = false;
    if (!r.ok){ err.textContent = errText(r.error); return; }
  }
  S.authed = true; start();
}

/* ---------------- start and routing ---------------- */
async function start(){
  frame(true);
  const h = location.hash;
  const m = /^#r=(\d{1,9})$/.exec(h);
  if (m){ S.view = "requests"; await openView("requests"); openRequest(Number(m[1])); return; }
  const v = ["requests", "projects", "settings"].includes(h.slice(1)) ? h.slice(1) : (S.view !== "auth" ? S.view : "requests");
  openView(v);
}
async function openView(v){
  S.view = v; renderTabs(); document.body.classList.remove("lock");
  if (location.hash !== "#" + v && !/^#r=/.test(location.hash)) history.replaceState(null, "", "#" + v);
  window.scrollTo(0, 0);
  if (v === "requests"){ renderRequests(); await loadRequests(); }
  else if (v === "projects"){ if (!S.draft) { $("#app").innerHTML = `<div class="boot" style="min-height:40vh"><span class="spin"></span></div>`; await loadContent(); } renderProjects(); }
  else if (v === "settings"){ renderSettings(); if (!S.draft) await loadContent(); await loadSettings(); renderSettings(); }
  renderSaveBar();
}

/* ---------------- requests ---------------- */
async function loadRequests(append){
  if (S.loadingList) return; S.loadingList = true;
  const qs = new URLSearchParams();
  if (S.status) qs.set("status", S.status);
  if (S.q) qs.set("q", S.q);
  if (append && S.items.length) qs.set("before", S.items[S.items.length - 1].id);
  const r = await call("GET", "admin/requests" + (qs.toString() ? "?" + qs : ""));
  S.loadingList = false;
  if (!r) return;
  S.items = append ? S.items.concat(r.items) : r.items; S.more = r.more; S.counts = r.counts || {};
  setBadge(); renderTabs();
  if (S.view === "requests") renderRequests();
}

  const d = r.data || {};

    <span class="l1"><b>${esc(r.name)}</b><span class="st ${esc(r.status)}">${esc(t("s_" + r.status))}</span></span>
    <span class="l2"><span class="num">${esc(r.no)}</span><span>${esc(L(d.catAr, d.catEn))}${d.total ? ` · <span class="num">${esc(d.total)}</span> ${esc(t("m2"))}` : ""}</span><span>${esc(ago(r.created))}</span></span>

function renderDetail(){ const h = $("#detailHost"); if (h) h.innerHTML = detailHtml(); document.querySelectorAll(".req").forEach(b => b.setAttribute("aria-current", String(!!S.sel && Number(b.dataset.req) === S.sel.id))); document.body.classList.toggle("lock", !!S.sel && matchMedia("(max-width:899px)").matches); }
async function openRequest(id){
  const r = await call("GET", "admin/requests/" + id);
  if (!r){ if (/^#r=/.test(location.hash)) history.replaceState(null, "", "#requests"); return; }
  S.sel = r.item; history.replaceState(null, "", "#r=" + id); renderDetail();
}
function closeRequest(){ S.sel = null; history.replaceState(null, "", "#requests"); renderDetail(); }
function updateItem(item){ const i = S.items.findIndex(x => x.id === item.id); if (i >= 0) S.items[i] = item; S.sel = item; }

/* ---------------- projects ---------------- */
async function loadContent(){
  const r = await call("GET", "admin/content");
  if (!r) return;
  S.base = { version: r.version, seeded: !!r.seeded, updated: r.updated };
  S.draft = { projects: r.projects.map(p => ({ ...p, tAr: (p.tAr || []).slice(), tEn: (p.tEn || []).slice() })), whatsapp: r.whatsapp || "", requestsOn: r.requestsOn !== false };
  S.saved = JSON.stringify(S.draft); S.dirty = false;
}
function markDirty(){ S.dirty = JSON.stringify(S.draft) !== S.saved; renderSaveBar(); }
function catName(id){ const c = JEC.CATS.find(x => x.id === id); return c ? L(c.sAr, c.sEn) : id; }
function renderProjects(){
  if (S.view !== "projects") return;
  if (!S.draft){ $("#app").innerHTML = `<div class="empty">${esc(errText("network"))}<div style="margin-top:12px"><button class="btn" data-act="reload-content">${esc(t("refresh"))}</button></div></div>`; return; }

  const rows = ps.map((p, i) => `<div class="proj ${p.hidden ? "off" : ""}">
      ${p.img && API.img(p.img) ? `<img src="${esc(API.img(p.img))}" alt="" loading="lazy">` : `<span class="thumb-empty"></span>`}
      <div class="t"><b>${esc(L(p.ar, p.en))}</b><span>${esc(catName(p.cat))} · ${esc(t(p.st === "live" ? "live" : "done"))}${p.reno ? " · " + esc(t("reno")) : ""}${p.brand ? " · " + esc(p.brand) : ""}${p.hidden ? " · " + esc(t("hiddenTag")) : ""}</span></div>

        <button class="icon-btn" data-p="edit" data-i="${i}" aria-label="${esc(t("edit"))}">${ic("edit")}</button>

    <div class="row between"><div><h1>${esc(t("pTitle"))} <span class="muted num" style="font-size:15px">(${ps.filter(p => !p.hidden).length}/${ps.length})</span></h1></div>

function renderSaveBar(){
  const bar = $("#savebar");
  bar.hidden = !(S.dirty && (S.view === "projects" || S.view === "settings"));
  if (!bar.hidden) bar.innerHTML = `<div><span>${esc(t("unsaved"))}</span><button class="btn line" data-act="undo">${esc(t("undo"))}</button><button class="btn gold" data-act="publish">${esc(t("publish"))}</button></div>`;
}
async function publish(){
  const btn = $("#savebar .gold"); if (btn) btn.disabled = true;
  const r = await call("PUT", "admin/content", { version: S.base.version, projects: S.draft.projects, whatsapp: S.draft.whatsapp, requestsOn: S.draft.requestsOn }, { quiet: true });
  if (btn) btn.disabled = false;
  if (!r || !r.ok){
    if (r && r.error === "conflict"){
      const go = await ask(t("conflict"), t("loadLatest"), false);
      if (go){ S.draft = null; await loadContent(); openView(S.view); }
      return;
    }
    if (r && r.error === "auth"){ S.authed = false; showAuth(); return; }
    toast(errText(r && r.error), true); return;
  }
  S.base = { version: r.version, seeded: false, updated: r.updated };
  S.draft = { projects: r.projects, whatsapp: r.whatsapp, requestsOn: r.requestsOn };
  S.saved = JSON.stringify(S.draft); S.dirty = false;
  toast(t(isDemo() ? "savedDemo" : "savedC"));
  renderSaveBar(); if (S.view === "projects") renderProjects(); else renderSettings();
}

/* a photo resized in the browser before upload: at most 1600 px, WebP (JPEG where the browser can't make WebP), under 1.5 MB */
async function shrink(file){
  let src;
  try { src = await createImageBitmap(file); }
  catch (e) { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  for (const [max, q] of [[1600, .84], [1400, .74], [1100, .68]]){
    const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    let b = await new Promise(r => c.toBlob(r, "image/webp", q));
    if (!b || b.type !== "image/webp") b = await new Promise(r => c.toBlob(r, "image/jpeg", q));
    if (b && b.size <= 1.45 * 1024 * 1024) return b;
  }
  throw Object.assign(new Error("too-large"), { code: "too-large" });
}
async function uploadPhoto(file){
  const msg = $("#phMsg"); if (!ED) return;
  msg.textContent = t("uploading"); msg.className = "muted";
  let blob;
  try { blob = await shrink(file); } catch (e) { msg.textContent = errText(e.code || "bad-image"); msg.className = "err"; return; }
  const r = await call("POST", "admin/photo", blob, { quiet: true });
  if (!r || !r.ok){ if (r && r.error === "auth"){ closeSheet(); S.authed = false; showAuth(); return; } msg.textContent = errText(r && r.error); msg.className = "err"; return; }
  if (!ED) return;
  ED.p.img = r.img; $("#phPrev").innerHTML = `<img src="${esc(API.img(r.img))}" alt="">`; msg.textContent = t("photoHint"); msg.className = "muted";
}

/* ---------------- settings ---------------- */
async function loadSettings(){ const r = await call("GET", "admin/settings"); if (r) S.settings = r; await pushState(); }
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let swReg = null;
async function sw(){
  if (!("serviceWorker" in navigator)) return null;
  if (swReg) return swReg;
  try { await navigator.serviceWorker.register("sw.js", { scope: "./" }); swReg = await navigator.serviceWorker.ready; } catch (e) { swReg = null; }
  return swReg;
}
async function pushState(){
  const s = { supported: pushSupported(), perm: "Notification" in window ? Notification.permission : "denied", sub: null };
  if (s.supported){ const reg = await sw(); if (reg){ try { s.sub = await reg.pushManager.getSubscription(); } catch (e) {} } }
  s.on = isDemo() ? (store.get("jec-demo-push") === "1" && s.perm === "granted") : !!(s.sub && s.perm === "granted");
  S.pushInfo = s;
}
const b64ToBytes = b => { const s = atob(b.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b.length + 3) % 4)); return Uint8Array.from(s, c => c.charCodeAt(0)); };
function deviceLabel(){
  const u = navigator.userAgent;
  const os = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) || isIOS() ? "iPad" : /Android/.test(u) ? "Android" : /Mac OS X/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows" : "Device";
  const br = /Edg\//.test(u) ? "Edge" : /CriOS|Chrome\//.test(u) ? "Chrome" : /FxiOS|Firefox\//.test(u) ? "Firefox" : /Safari\//.test(u) ? "Safari" : "";
  return (os + (br ? " · " + br : "") + (standalone() ? " · app" : "")).slice(0, 40);
}
async function pushEnable(){
  if (!pushSupported()){ toast(t("pushNo"), true); return; }
  let perm = Notification.permission;
  if (perm !== "granted") perm = await Notification.requestPermission();
  if (perm !== "granted"){ toast(t("pushDenied"), true); await pushState(); renderSettings(); return; }
  const reg = await sw(); if (!reg){ toast(t("pushNo"), true); return; }
  if (isDemo()){ store.set("jec-demo-push", "1"); toast(t("pushDone")); await pushState(); renderSettings(); return; }
  const k = await call("GET", "admin/push/key"); if (!k) return;
  let sub = await reg.pushManager.getSubscription();
  try {
    if (sub){ const old = sub.options && sub.options.applicationServerKey; if (old && btoa(String.fromCharCode(...new Uint8Array(old))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") !== k.key){ await sub.unsubscribe(); sub = null; } }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(k.key) });
  } catch (e) { toast(t("pushFailed"), true); return; }
  const r = await call("POST", "admin/push/subscribe", { subscription: sub.toJSON(), label: deviceLabel() });
  if (!r) return;
  store.set("jec-push-endpoint", sub.endpoint);
  toast(t("pushDone")); await loadSettings(); renderSettings();
}
async function pushTest(){
  if (isDemo()){
    const reg = await sw();
    if (reg) await reg.showNotification("JEC — تجربة", { body: lang === "ar" ? "الإشعارات تعمل على هذا الجهاز." : "Notifications work on this device.", icon: "icon-192.png", badge: "badge-96.png", tag: "test" });
    return;
  }
  const sub = S.pushInfo && S.pushInfo.sub;
  const r = await call("POST", "admin/push/test", { endpoint: sub ? sub.endpoint : undefined });
  if (!r) return;
  toast(r.sent ? t("pushSent") : t("pushFailed"), !r.sent); await loadSettings(); renderSettings();
}
async function pushDisable(){
  if (isDemo()){ store.del("jec-demo-push"); toast(t("pushStopped")); await pushState(); renderSettings(); return; }
  const sub = S.pushInfo && S.pushInfo.sub;
  if (sub){ await call("POST", "admin/push/unsubscribe", { endpoint: sub.endpoint }, { quiet: true }); try { await sub.unsubscribe(); } catch (e) {} }
  store.del("jec-push-endpoint"); toast(t("pushStopped")); await loadSettings(); renderSettings();
}

      `<li><span>${esc(v.label || "—")}${v.id === mine ? ` <b class="ok">· ${esc(t("thisDev"))}</b>` : ""}<br><small class="muted">${esc(fmtDate(v.created))}${v.lastErr ? ` · <span class="bad">${esc(v.lastErr)}</span>` : ""}</small></span><button class="btn line" data-dev="${esc(v.id)}">${esc(t("remove"))}</button></li>`).join("")}</ul>` : "";
  const push = `<div class="card"><h2>${esc(t("sPush"))}</h2><p>${esc(t("sPushLead"))}</p>${pushBody}${devs}${st ? lastLine("lastPush", st.pushLast) : ""}</div>`;
  /* email */
  const mail = `<div class="card"><h2>${esc(t("sMail"))}</h2><p>${esc(t("sMailLead"))}</p>
    ${!st ? `<span class="spin"></span>` : `
    ${isDemo() ? `<div class="note small" style="margin-bottom:12px">${esc(t("demoMail"))}</div>` : st.mailReady ? `<p class="ok small" style="margin:0 0 10px">${esc(t("mailReady"))}</p>` : `<div class="note warn small" style="margin-bottom:12px">${esc(t("mailNotReady"))}</div>`}
    <form id="fMail" class="stack">
      <label class="field"><span>${esc(t("mail"))}</span><input type="email" id="sMailTo" dir="ltr" autocomplete="email" maxlength="200" value="${esc(st.alertEmail)}"><small>${esc(t("mailNote"))}</small></label>
      <label class="switch"><input type="checkbox" id="sMailOn" ${st.mailOn ? "checked" : ""}><span>${esc(t("mailOn"))}</span></label>
      <div class="row"><button class="btn gold" type="submit">${esc(t("save"))}</button><button class="btn line" type="button" data-act="mail-test" ${!st.mailReady || !st.alertEmail ? "disabled" : ""}>${esc(t("mailTest"))}</button></div>
    </form>${lastLine("lastMail", st.mailLast)}`}</div>`;
  /* install */
  const inst = `<div class="card"><h2>${esc(t("sInstall"))}</h2><p>${esc(t("sInstallLead"))}</p>
    ${standalone() ? `<p class="ok" style="margin:0">${esc(t("installed"))}</p>` : `${S.installEvt ? `<button class="btn gold" data-act="install">${esc(t("install"))}</button>` : ""}
    <div class="small muted stack" style="margin-top:10px"><div>${esc(t("instIos"))}</div><div>${esc(t("instAnd"))}</div></div>`}</div>`;
  /* account (the demo has no password) */
  const acc = isDemo() ? `<div class="card"><h2>${esc(t("sAcc"))}</h2><p>${esc(t("demoNoPw"))}</p>

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab){ if (tab.dataset.tab === S.view) return; S.sel = null; openView(tab.dataset.tab); return; }
  const chip = e.target.closest("[data-status]");
  if (chip){ S.status = chip.dataset.status; S.items = []; renderRequests(); loadRequests(); return; }
  const rq = e.target.closest("[data-req]");
  if (rq){ openRequest(Number(rq.dataset.req)); return; }
  const ss = e.target.closest("[data-set-status]");
  if (ss && S.sel){
    const r = await call("PATCH", "admin/requests/" + S.sel.id, { status: ss.dataset.setStatus });
    if (r){ updateItem(r.item); toast(t("statusSaved")); renderDetail(); loadRequests(); }
    return;
  }
  const pb = e.target.closest("[data-p]");
  if (pb){
    const i = Number(pb.dataset.i), ps = S.draft.projects;
    if (pb.dataset.p === "up" && i > 0){ [ps[i - 1], ps[i]] = [ps[i], ps[i - 1]]; }
    else if (pb.dataset.p === "down" && i < ps.length - 1){ [ps[i + 1], ps[i]] = [ps[i], ps[i + 1]]; }
    else if (pb.dataset.p === "hide"){ ps[i].hidden = !ps[i].hidden; }
    else if (pb.dataset.p === "edit"){ editProject(i); return; }
    else if (pb.dataset.p === "del"){ if (!(await ask(t("pDelQ"), t("del")))) return; ps.splice(i, 1); }
    renderProjects(); markDirty(); return;
  }
  const seg = e.target.closest(".seg button");
  if (seg){ seg.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === seg))); return; }
  const dev = e.target.closest("[data-dev]");
  if (dev){ const r = await call("POST", "admin/push/unsubscribe", { id: dev.dataset.dev }); if (r){ await loadSettings(); renderSettings(); } return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "retry") return boot();
  if (act === "auth-reset") return showAuth("reset");
  if (act === "auth-login") return showAuth("login");
  if (act === "clear-demo"){
    if (!(await ask(t("clearDemoQ"), t("clearDemo")))) return;
    try { Object.keys(localStorage).filter(k => k.startsWith("jec-demo")).forEach(k => localStorage.removeItem(k)); } catch (err) {}
    S.draft = null; S.items = []; S.counts = {}; S.dirty = false; return showAuth();
  }
  if (act === "reload"){ loadRequests(); if (S.sel) openRequest(S.sel.id); return; }
  if (act === "more") return loadRequests(true);
  if (act === "close-req") return closeRequest();
  if (act === "copy-req" && S.sel){ try { await navigator.clipboard.writeText(summaryText(S.sel)); toast(t("copied")); } catch (err) { toast(t("copyFail"), true); } return; }
  if (act === "save-note" && S.sel){ const r = await call("PATCH", "admin/requests/" + S.sel.id, { note: $("#rNote").value }); if (r){ updateItem(r.item); toast(t("noteSaved")); } return; }
  if (act === "del-req" && S.sel){
    if (!(await ask(t("delQ"), t("del")))) return;
    const id = S.sel.id, r = await call("DELETE", "admin/requests/" + id);
    if (r){ S.items = S.items.filter(x => x.id !== id); S.sel = null; history.replaceState(null, "", "#requests"); toast(t("deleted")); renderRequests(); loadRequests(); }
    return;
  }
  if (act === "add-proj") return editProject(-1);
  if (act === "ed-cancel"){ ED = null; closeSheet(); return; }
  if (act === "undo"){ S.draft = JSON.parse(S.saved); S.dirty = false; renderSaveBar(); return S.view === "projects" ? renderProjects() : renderSettings(); }
  if (act === "publish") return publish();
  if (act === "reload-content"){ await loadContent(); return renderProjects(); }
  if (act === "push-on") return pushEnable();
  if (act === "push-test") return pushTest();
  if (act === "push-off") return pushDisable();
  if (act === "mail-test"){ const r = await call("POST", "admin/mail/test"); if (r){ toast(t("mailSent")); } await loadSettings(); renderSettings(); return; }
  if (act === "install" && S.installEvt){ S.installEvt.prompt(); try { await S.installEvt.userChoice; } catch (err) {} S.installEvt = null; renderSettings(); return; }
  if (act === "logout"){
    if (S.dirty && !(await ask(t("leaveQ"), t("logout")))) return;
    await call("POST", "admin/logout", undefined, { quiet: true });
    S.authed = false; S.draft = null; S.dirty = false; S.items = []; S.sel = null; S.settings = null; showAuth("login"); return;
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "fLogin" || f.id === "fSetup") return submitAuth(f);
  if (f.id === "fProj") return applyProject();
  if (f.id === "fMail"){
    const r = await call("PUT", "admin/settings", { alertEmail: $("#sMailTo").value.trim(), mailOn: $("#sMailOn").checked });
    if (r){ S.settings = r; toast(t("mailSaved")); renderSettings(); }
    return;
  }
  if (f.id === "fPw"){
    const err = $("#pwErr"); err.textContent = "";
    const next = $("#pwNew").value;
    if (next.length < 10){ err.textContent = errText("password-short"); return; }
    if (next !== $("#pwNew2").value){ err.textContent = t("mismatch"); return; }
    const r = await call("POST", "admin/password", { current: $("#pwCur").value, next }, { quiet: true });
    if (!r.ok){ if (r.error === "auth"){ S.authed = false; return showAuth(); } err.textContent = errText(r.error); return; }
    f.reset(); toast(t("pwChanged"));
  }
});
document.addEventListener("change", e => {

document.addEventListener("input", e => {

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;

$("#langBtn").addEventListener("click", () => {

addEventListener("beforeunload", e => { if (S.dirty){ e.preventDefault(); e.returnValue = ""; } });
addEventListener("hashchange", () => {
  if (!S.authed) return;
  const m = /^#r=(\d{1,9})$/.exec(location.hash);
  if (m){ if (S.view !== "requests") openView("requests").then(() => openRequest(Number(m[1]))); else if (!S.sel || S.sel.id !== Number(m[1])) openRequest(Number(m[1])); return; }
  const v = location.hash.slice(1);
  if (["requests", "projects", "settings"].includes(v) && v !== S.view) openView(v);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.authed && S.view === "requests") loadRequests(); });
addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; if (S.view === "settings") renderSettings(); });
if ("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", e => {
    const m = e.data || {};
    if (m.type === "push" && S.authed){ toast(t("newReq")); loadRequests(); }
    if (m.type === "open" && typeof m.url === "string"){ const u = new URL(m.url); if (u.origin === location.origin) location.hash = u.hash || "#requests"; }
  });
}

/* ---------------- boot ---------------- */
async function boot(){
  S.mode = await API.detect();
  applyLang();
  sw();
  await showAuth();
}
boot();
